name: uni-db CI

# Lint + unit tests for the Python service. The repo's other CI job only covers
# Flutter, so until now the uni_db pipeline had no automated check. Runs offline
# (no live APIs / DB) on every change under services/uni_db.

on:
  pull_request:
    paths:
      - "services/uni_db/**"
      - ".github/workflows/uni-db-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/uni_db/**"
      - ".github/workflows/uni-db-ci.yml"

concurrency:
  group: uni-db-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/uni_db
    env:
      # Hard-off so a stray import can never hit a paid API or live DB in CI.
      UNI_DB_LIVE_APIS: "false"
      UNI_DB_LIVE_CRAWL: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/uni_db/pyproject.toml

      - name: Install service + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest (unit)
        run: pytest tests/unit -q
