name: uni-db discover

# Auto-discovery of unknown ac.kr admission boards via the Naver web-search
# API. For each Korean admission keyword it searches, keeps the .ac.kr hits
# that carry an admission signal, and writes them to `proposed_sources` for
# the in-office reviewer to approve. Approved rows are promoted into
# `announcement_sources` by a DB trigger — NOTHING goes live without a human,
# so this is safe to run on a schedule.
#
# Free: no LLM, no PDF fetch — just the (free-tier) Naver search API + a few
# inserts. It only needs the Naver keys + the DB URL, not the Anthropic key.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   UNI_DB_SUPABASE_DB_URL
#   UNI_DB_NAVER_SEARCH_CLIENT_ID
#   UNI_DB_NAVER_SEARCH_CLIENT_SECRET

on:
  schedule:
    # Daily 20:00 UTC (05:00 KST) — BROAD: scan all of .ac.kr for newly-posted
    # admission boards. Discovery is cheap and the HITL queue, not the crawler,
    # is the bottleneck.
    - cron: "0 20 * * *"
    # Weekly Monday 18:00 UTC — TARGETED: search inside each known university
    # domain for its foreign-applicant (외국인/재외국민) page, so coverage of
    # foreign pages becomes systematic instead of luck-of-the-draw.
    - cron: "0 18 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "broad (scan all .ac.kr) or targeted (per-university foreign page)"
        type: choice
        options: ["broad", "targeted"]
        default: "broad"
        required: false
      days:
        description: "broad mode only: consider posts from the last N days"
        default: "150"
        required: false

concurrency:
  group: uni-db-discover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/uni_db
    env:
      UNI_DB_LIVE_APIS: "true"
      UNI_DB_ENV: "production"
      SUPABASE_DB_URL: ${{ secrets.UNI_DB_SUPABASE_DB_URL }}
      NAVER_SEARCH_CLIENT_ID: ${{ secrets.UNI_DB_NAVER_SEARCH_CLIENT_ID }}
      NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.UNI_DB_NAVER_SEARCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/uni_db/pyproject.toml

      - name: Install service (base deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check required secrets are set
        run: |
          if [ -z "${SUPABASE_DB_URL}" ] || [ -z "${NAVER_SEARCH_CLIENT_ID}" ] || [ -z "${NAVER_SEARCH_CLIENT_SECRET}" ]; then
            echo "::error::Missing secrets. discover needs UNI_DB_SUPABASE_DB_URL, UNI_DB_NAVER_SEARCH_CLIENT_ID and UNI_DB_NAVER_SEARCH_CLIENT_SECRET."
            exit 1
          fi

      - name: Discover admission pages
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # Scheduled run: the weekly cron does the targeted foreign-page pass;
            # everything else (the daily cron) does the broad scan.
            if [ "${{ github.event.schedule }}" = "0 18 * * 1" ]; then
              MODE="targeted"
            else
              MODE="broad"
            fi
          fi
          echo "Running discovery: mode=$MODE"
          uni-db propose-sources --mode "$MODE" --days "${{ github.event.inputs.days || '150' }}"
