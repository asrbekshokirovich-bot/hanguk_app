name: CI

# P1 #24: minimal CI on PR / push to main — `flutter analyze` + `flutter
# test`. We deliberately skip `flutter build` here because the release
# pipeline needs the signing keystore (not available in CI) and the
# bundle build is ~10 min on a hosted runner, which we'll wire up
# separately once the team is ready for staged rollouts.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        # Tests tagged `manual` are integration probes (Vapi network +
        # platform permission channels) that can't run on a headless
        # CI runner. Exclude them here; run locally on a device.
        run: flutter test --exclude-tags=manual
