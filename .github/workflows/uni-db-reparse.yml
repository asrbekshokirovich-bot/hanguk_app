name: uni-db reparse

# Manual: re-extract guideline documents ALREADY stored, applying the latest
# extraction/normalization fixes to existing data. Reads stored PDFs (does NOT
# re-fetch from ac.kr, so it works even when a source site is unreachable);
# the Phase 1 dedup supersedes the old review cards with the fresh ones.
#
# Paid (re-runs LLM extraction) — run occasionally after a fix release, not on
# a schedule. Needs the same UNI_DB_* secrets as uni-db-sync.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max stored documents to re-extract this run"
        default: "50"
        required: false
      institution:
        description: "Optional: limit to one institution by domain (e.g. inha.ac.kr)"
        default: ""
        required: false

concurrency:
  group: uni-db-reparse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reparse:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: services/uni_db
    env:
      UNI_DB_LIVE_APIS: "true"
      UNI_DB_ENV: "production"
      SUPABASE_DB_URL: ${{ secrets.UNI_DB_SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.UNI_DB_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UNI_DB_SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.UNI_DB_ANTHROPIC_API_KEY }}
      DEEPL_API_KEY: ${{ secrets.UNI_DB_DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/uni_db/pyproject.toml

      - name: Install service (base deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check required secrets are set
        run: |
          if [ -z "${SUPABASE_DB_URL}" ] || [ -z "${ANTHROPIC_API_KEY}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Missing secrets. reparse needs UNI_DB_SUPABASE_DB_URL, UNI_DB_ANTHROPIC_API_KEY and UNI_DB_SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

      - name: Re-extract stored documents
        run: |
          if [ -n "${{ github.event.inputs.institution }}" ]; then
            uni-db reparse --limit "${{ github.event.inputs.limit || '50' }}" --institution "${{ github.event.inputs.institution }}"
          else
            uni-db reparse --limit "${{ github.event.inputs.limit || '50' }}"
          fi
